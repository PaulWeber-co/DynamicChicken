name: DynamicKnuddl
options:
  bundleIdPrefix: com.paulweber
  deploymentTarget:
    iOS: "16.2"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  DynamicKnuddl:
    type: application
    platform: iOS
    sources:
      - DynamicKnuddl
    settings:
      base:
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        PRODUCT_BUNDLE_IDENTIFIER: com.paulweber.DynamicKnuddl
        PRODUCT_NAME: DynamicKnuddl
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: "8938MV67N2"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
    dependencies:
      - target: PetWidgetExtension
  PetWidgetExtension:
    type: app-extension
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paulweber.DynamicKnuddl.PetWidget
        PRODUCT_NAME: PetWidgetExtension
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PetWidget/Info.plist
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: "8938MV67N2"
        CODE_SIGN_STYLE: Automatic
    sources:
      - PetWidget
      - path: DynamicKnuddl/Helpers/ChickenSprites.swift
      - path: DynamicKnuddl/Helpers/Constants.swift
      - path: DynamicKnuddl/Helpers/PixelGrid.swift
      - path: DynamicKnuddl/Model/CatState.swift
      - path: DynamicKnuddl/Model/PetActivityAttributes.swift







