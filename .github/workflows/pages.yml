name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Die Quelle muss auf "GitHub Actions" stehen.
      #
      # Steht sie auf "Deploy from a branch", startet GitHub bei jedem Push
      # zusätzlich seine eigene Jekyll-Pipeline ("pages build and
      # deployment") — und die ist es dann auch, die die Seite ausliefert.
      # Zwei Deployments für denselben Commit vertragen sich nicht: eines
      # gewinnt, das andere scheitert mit 503. Bleibt die alte Pipeline die
      # ausliefernde, hängt die Seite auf dem letzten Stand fest, der dort
      # durchlief — auch wenn dieser Workflow grün ist.
      #
      # configure-pages richtet Pages zwar ein, ändert aber die Quelle eines
      # bereits eingerichteten Repos nicht. Also stellen wir sie selbst um.
      # Schlägt das fehl (fehlende Rechte), läuft der Rest trotzdem weiter.
      - name: Quelle auf GitHub Actions stellen
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            gh api -X PUT "repos/${{ github.repository }}/pages" -f build_type=workflow
            echo "Quelle auf 'GitHub Actions' gesetzt."
          else
            gh api -X POST "repos/${{ github.repository }}/pages" -f build_type=workflow
            echo "Pages eingerichtet, Quelle 'GitHub Actions'."
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Es gibt keinen Build-Schritt: Die App ist bereits statisch.
      # Wir laden das Repository so hoch, wie es ist.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # Die Pages-API antwortet gelegentlich mit 503. Das ist keine
      # Fehlkonfiguration, sondern eine Störung auf GitHub-Seite — also
      # einmal warten und noch einmal versuchen, statt rot zu bleiben.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - if: steps.deployment.outcome == 'failure'
        run: |
          echo "Erster Versuch fehlgeschlagen — 45 Sekunden warten."
          sleep 45

      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
